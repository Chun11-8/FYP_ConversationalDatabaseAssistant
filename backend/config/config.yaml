# Non-secret configuration defaults.
# Secret values (API keys, passwords) must live in secrets.env — never here.

llm:
  model: gpt-4o-mini
  # GH#65: point the QUERY STAGE at any OpenAI-COMPATIBLE endpoint to use
  # open-weight models from other vendors (Llama, DeepSeek, Qwen, Mistral,
  # Gemma, GPT-OSS). Unset → OpenAI. Overridden by $LLM_BASE_URL, and by
  # --base-url on the eval CLIs. Embeddings ALWAYS stay on OpenAI: the
  # pgvector columns are sized for text-embedding-3-small (1536 dims), so
  # changing the embedder means a full re-index.
  #   OpenRouter  https://openrouter.ai/api/v1      (one key, many vendors)
  #   Groq        https://api.groq.com/openai/v1
  #   DeepSeek    https://api.deepseek.com
  #   Together    https://api.together.xyz/v1
  #   Gemini      https://generativelanguage.googleapis.com/v1beta/openai/
  #   Ollama      http://localhost:11434/v1         (local, no key)
  # base_url:
  # GH#38 model routing (optional): cheaper models for one-token intent
  # classification and response formatting. Absent → main model reused.
  # intent_model: gpt-4o-mini
  # format_model: gpt-4o-mini
  # GH#52: models exposed to the frontend's per-request model picker. `model`
  # above is always included even if omitted from this list. GH#58: the picker
  # also offers a free-text "Custom…" entry — any well-formed OpenAI model id
  # is accepted, not just the ones listed here (see api/main.py::_validate_model).
  selectable_models:
    - gpt-4o-mini
    - gpt-4o
    - gpt-4.1-mini
  # GH#57 cost accounting: USD per 1M tokens, merged over the built-in table in
  # backend/agents/usage.py. A model absent here still has its tokens counted,
  # it just contributes no dollar figure. Update when OpenAI changes prices.
  # Non-OpenAI models (GH#65) have no built-in price, so cost reads $0.00 until
  # you add them here — tokens are still counted either way. Namespaced ids
  # must be quoted in YAML. The non-OpenAI figures below are ILLUSTRATIVE
  # placeholders — look up your provider's current rates before trusting a
  # cost number in a report.
  # pricing:
  #   gpt-4o-mini:
  #     input: 0.15
  #     output: 0.60
  #   "deepseek-chat":
  #     input: 0.28
  #     output: 0.42
  #   "meta-llama/Llama-3.3-70B-Instruct":
  #     input: 0.12
  #     output: 0.30

db:
  dialect: postgres
  # GH#41: transaction-scoped statement timeout for USER queries (ms).
  statement_timeout_ms: 15000
  host: "127.0.0.1"
  port: 5432
  name: FYP
  user: postgres

sql:
  # Schema-linking & question-understanding stage (Issue #17). When true, a
  # structured query plan is produced before SQL generation. Set false to A/B.
  schema_linking: true
  # Append a safety LIMIT to executed queries in the LIVE pipeline (UI safety
  # net). Set false when benchmarking so a LIMIT is never bolted onto queries
  # that gold answers don't have. The BIRD harness never applies it either way.
  enforce_limit: true
  # Number of SQL candidates to generate per question (one LLM call).
  n_candidates: 5
  # Difficulty-adaptive prompting (Issue #27): strategy block + per-tier
  # candidate counts. BIRD passes the real difficulty; live infers from the plan.
  adaptive_prompting: true
  candidates_by_tier:
    simple: 2
    moderate: 5
    challenging: 7
  # Execution-guided candidate selection (BIRD harness AND live pipeline):
  # run every valid candidate, plurality-vote on result fingerprints; the text
  # reranker only breaks ties. Set false (or --no-exec-voting) to A/B.
  execution_voting: true
  # GH#69: gold-free risk checks on the executed result — zero rows,
  # ungrounded WHERE literal, cross join, missing GROUP BY, LIMIT 1 on a
  # plural question, arity vs the plan, table outside the retrieved schema.
  # They ANNOTATE only: no query is blocked, rewritten or retried. Set false
  # to A/B the flags against the labelled benchmark data.
  risk_checks: true
  # GH#76 — both DEFAULT OFF. Attributing all 57 gpt-5-mini BIRD failures showed
  # 74% had the right tables AND joins and differed only in projection,
  # aggregation or grain; 52% of those picked the wrong aggregate. Both knobs
  # below target that, and both change what the model is asked to produce, so
  # their effect on accuracy is a HYPOTHESIS until the A/B is run.
  #
  # plan_diversity: on a hard question, ask the linker for a SECOND plan that
  # deliberately disagrees on grain/aggregation and generate candidates from
  # both. Today every candidate comes from one plan, which is why 41 of 57
  # errors had unanimous agreement — candidates cannot disagree about a
  # decision none of them made. Costs one extra LLM call per hard question.
  plan_diversity: false
  # plan_rationale: make the linker name the answer's GRAIN and justify the
  # aggregate against the evidence (100% of these failures carried evidence
  # describing the computation). Costs a longer planner prompt, no extra call.
  plan_rationale: false
  # GH#41: cap on candidates executed during voting + early plurality stop.
  vote_max_candidates: 5
  # GH#48: reasoning-path-diverse candidates (moderate/challenging tiers only):
  # part of the candidate budget goes to a divide-and-conquer and a
  # query-plan-CoT prompt instead of N× the direct prompt — decorrelated errors
  # give execution voting real signal. Set false to A/B.
  path_diversity: true
  # GH#48: when execution voting is inconclusive, resolve with a unit-test
  # screen + pairwise LLM comparison over the ACTUAL result rows ("pairwise");
  # "reranker" restores the rows-blind text reranker.
  selection: pairwise
  unit_tests: true
  # GH#49: ReAct execute→refine depth. Challenging-tier questions get more
  # rounds (RSL-SQL/CHESS use multi-turn correction).
  max_refine_rounds: 1
  max_refine_rounds_challenging: 2
  # GH#38: semantic-cache hit shortcut — a near-identical past question skips
  # linking+generation (cached SQL still re-validates). 0.03 ≈ near-exact text.
  cache_shortcut: true
  cache_hit_threshold: 0.03
  # GH#57 cost routing. fast_path: a repeat question is resolved against the
  # cache BEFORE the graph runs, so it also skips intent classification and
  # follow-up condensation (anaphoric follow-ups always take the full path).
  # answer_reuse: the cached SQL is still re-validated and re-executed, but if
  # the fresh rows hash identical to the stored ones the stored answer is
  # returned verbatim — zero LLM calls. Never serves stale data. Both false
  # reproduces pre-GH#57 behavior exactly.
  fast_path: true
  answer_reuse: true
  # DAIL-SQL-style few-shot selection: blend structural-shape overlap
  # (aggregation type, GROUP BY, joins, superlative shape) with embedding
  # distance when picking few-shot examples, instead of pure embedding
  # distance. weight=0 reduces to the old pure-embedding ranking.
  fewshot_skeleton_blend: true
  fewshot_skeleton_weight: 0.3
  # GH#40 multi-turn: condense anaphoric follow-ups into standalone questions
  # before retrieval, and ask ONE clarifying question on AMBIGUOUS intent
  # instead of running the full generation pipeline first.
  condense_followups: true
  clarify_on_ambiguous: true
  # GH#45 step 4: inject DISTINCT on "list" questions over joins (deterministic).
  distinct_postpass: true
  # Strict schema-grounded validation (GH #19): a query referencing unknown
  # tables/columns is BLOCKED (triggers regeneration) instead of executing and
  # returning wrong rows. CTE names / aliases defined in the query are tolerated.
  strict_semantic: true

retrieval:
  vector_store: pgvector
  top_k_tables: 5
  top_k_kb: 3
  # FK-aware context expansion: hop depth (2 reaches through bridge tables),
  # cap on FK-added tables, and an approximate token budget for the schema
  # context (FK tables are dropped farthest-hop-first; primaries never dropped).
  fk_max_hops: 2
  fk_max_expansion: 5
  max_schema_tokens: 4000
  # GH#49 P3: deterministic WHERE-literal grounding — an in-memory distinct-
  # value index over TEXT columns corrects casing/format of literals the user
  # (or evidence) wrote differently from the stored values. No LLM calls.
  value_grounding: true
  # GH#49 P4: RSL-SQL-style backward linking — when the linker plan names a
  # table forward retrieval missed, its schema chunk is fetched by name and
  # appended to the context before generation.
  backward_linking: true
  # GH#49: schema chunk format — "verbose" (default) or "mschema" (XiYan-SQL's
  # compact layout). Selected via the SCHEMA_FORMAT env var at BUILD time;
  # switching requires a full re-index (python -m backend.retrieval.indexing build).
  # schema_format: verbose

response:
  inline_row_limit: 10
  table_row_limit: 100
  csv_row_limit: 500

logging:
  # GH#42: rich console pipeline banners (the tuning workflow). Set false for
  # structured logs only — request IDs + per-stage timings remain either way.
  pipeline_trace: true
