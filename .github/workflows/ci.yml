name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        # Run as a module from the repo root so the `backend.` package resolves.
        # DB-dependent tests skip automatically when no PostgreSQL is reachable;
        # all LLM calls are mocked, so no secrets are required in CI.
        run: python -m pytest backend/tests -v

      - name: Lint (ruff — advisory, non-blocking)
        continue-on-error: true
        run: |
          pip install ruff
          ruff check backend

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (includes tsc typecheck)
        run: npm run build
